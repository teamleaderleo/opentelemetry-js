name: Fieldwork Lifecycle Characterization

on:
  push:
    branches:
      - fieldwork/nodesdk-lifecycle-execution

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Use repository build Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ^26.3.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Compile
        run: npm run compile

      - name: SDK Node lifecycle tests
        run: npm test --workspace=@opentelemetry/sdk-node

      - name: Trace SDK lifecycle tests
        run: npm test --workspace=@opentelemetry/sdk-trace

      - name: Logs SDK lifecycle tests
        run: npm test --workspace=@opentelemetry/sdk-logs

      - name: Metrics SDK lifecycle tests
        run: npm test --workspace=@opentelemetry/sdk-metrics
